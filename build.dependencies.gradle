repositories {
    mavenCentral()
    maven { url 'https://repo.dairy.foundation/releases/' }
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:11.2.1'
    implementation 'org.firstinspires.ftc:Blocks:11.2.1'
    implementation 'org.firstinspires.ftc:RobotCore:11.2.1'
    implementation 'org.firstinspires.ftc:RobotServer:11.2.1'
    implementation 'org.firstinspires.ftc:OnBotJava:11.2.1'
    implementation 'org.firstinspires.ftc:Hardware:11.2.1'
    implementation 'org.firstinspires.ftc:FtcCommon:11.2.1'
    implementation 'org.firstinspires.ftc:Vision:11.2.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.3'
    runtimeOnly 'org.tensorflow:tensorflow-lite:2.12.0'
    // Pedro's AutoTune (com.pedropathing:tuning) pulls in Sloth 0.3.2. Sloth replaces the class
    // loading/scanning that stock FTC Dashboard relies on, so stock Dashboard's @Config edits and
    // telemetry stop working. Slothboard is Dashboard 0.6.0 rebuilt for Sloth: same
    // com.acmerobotics.dashboard packages, no code changes. Keep its Sloth version (0.3.2) in step
    // with the one `gradlew :TeamCode:dependencies` shows under com.pedropathing:tuning.
    // It still requests /dash/decode.webp, which TeamCode overrides with FIRST's BIOBUZZ
    // Figure 9-2 (+X up, +Y left).
    implementation 'com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0'
}
