//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // Off-robot unit tests: control/ and the subsystem logic are pure Java, so they run in a plain JVM.
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
                events "passed", "failed", "skipped"
                showStandardStreams = true
                exceptionFormat = "full"
            }
        }
    }
}

repositories {
    maven { url 'https://central.sonatype.com/repository/maven-snapshots' }
}

// Pedro 3 only ships snapshots; pin one build so upstream pushes can't change the API under us.
def pedroVersion = '3.0.0-20260909.040423-37'

dependencies {
    implementation project(':FtcRobotController')
    implementation 'com.google.ar:core:1.25.0'
    implementation("com.pedropathing:revhub:$pedroVersion") { exclude group: 'com.pedropathing', module: 'core' }
    implementation "com.pedropathing:core:$pedroVersion"

    testImplementation 'junit:junit:4.13.2'
}
